<div class="flex flex-col w-full min-h-screen">
    <!-- Content Area -->
    <div class="flex flex-col w-full p-4">
        <!-- Title -->
        <div class="text-4xl font-extrabold tracking-tight leading-tight">उपस्थिती पत्र</div>
        <div class="mt-2 text-lg text-gray-600">
            उपस्थिती रेकॉर्ड्स सहजपणे पाहा आणि व्यवस्थापित करा.        
        </div>

        <!-- Alert -->
        <fuse-alert
            class="mt-8"
            *ngIf="showAlert"
            [appearance]="'outline'"
            [showIcon]="false"
            [type]="alert.type"
            [@shake]="alert.type === 'error'">
            {{ alert.message }}
        </fuse-alert>

        <!-- Attendance Table -->
        <div class="mt-8 overflow-x-auto">
            <table mat-table [dataSource]="attendanceData" class="mat-elevation-z8 w-full">

                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef>क्रिया</th>
                    <td mat-cell *matCellDef="let record">
                        <button
                            mat-icon-button
                            [color]="'primary'"
                            (click)="editRecord(record)">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button
                            mat-icon-button
                            [color]="'warn'"
                            (click)="deleteRecord(record.id)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>
                <!-- ID Column -->
                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef>क्रमांक</th>
                    <td mat-cell *matCellDef="let record">{{ record.id }}</td>
                </ng-container>
        
                <!-- Name Column -->
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>नाव</th>
                    <td mat-cell *matCellDef="let record">{{ record.name }}</td>
                </ng-container>
        
                <!-- Status Column -->
                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef>स्थिती</th>
                    <td mat-cell *matCellDef="let record">
                        <mat-checkbox
                            [checked]="record.status"
                            (change)="toggleStatus(record)">
                        </mat-checkbox>
                    </td>
                </ng-container>
        
                <!-- Actions Column -->
                <!-- <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef>क्रिया</th>
                    <td mat-cell *matCellDef="let record">
                        <button
                            mat-icon-button
                            [color]="'primary'"
                            (click)="editRecord(record)">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button
                            mat-icon-button
                            [color]="'warn'"
                            (click)="deleteRecord(record.id)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container> -->
        
                <!-- Table Header and Rows -->
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </div>
        
    </div>
</div>
